  <path d="M22 13 C23 9, 27 8, 28 6" stroke="#2e7060" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M22 13 C20 8, 20 4, 19 3" stroke="#2e7060" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- ground -->
