<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- sky bg -->
  <rect width="32" height="32" rx="6" fill="#e6f2ee"/>

  <!-- house body -->
  <rect x="7" y="17" width="13" height="10" rx="1" fill="#2e7060"/>

  <!-- pitched roof -->
  <polygon points="5,17 13.5,8 22,17" fill="#1a2520"/>

  <!-- door -->
